<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="container">
    <section class="text-center mt-5">
        <h1>Cinelog II- APISs, JSON y servicios Web</h1>
        <p class="lead">Buscador de películas utilizando la API de OMDB</p>
    </section>

    <section class="text-center mt-5">
        <h3>Buscar pelicula</h3>
        <form id="formulario" class="justify-content-center">
            <div class="row mb-3">
                <div class="col-sm-6 md-2">
                    <input type="text" id="busqueda"class="form-control" placeholder="Ingrese el nombre de la pelicula">
                    <div class="invalid-feedback">
                        Por favor, ingrese el nombre de la pelicula
                    </div>
                </div>
                <div class="col-sm-4 md-2">
                    <button type="submit" id="botonBuscar" class="btn btn-primary">Buscar</button>
                </div>
            </div>
        </form>
    </section>

    <hr>
    <section>
        <div id="resultadoBusqueda"></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
